services:
  postgres-db:
    image: postgres:15-alpine
    container_name: chifa-db
    environment:
      - POSTGRES_USER=chifa_admin
      - POSTGRES_PASSWORD=chifa_password
      - POSTGRES_DB=chifa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

